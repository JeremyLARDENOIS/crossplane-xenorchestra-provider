apiVersion: network.xenorchestra.crossplane.io/v1alpha1
kind: BondedNetwork
metadata:
  annotations:
    meta.upbound.io/example-id: network/v1alpha1/bondednetwork
  labels:
    testing.upbound.io/example-name: network
  name: network
spec:
  forProvider:
    bondMode: active-backup
    nameLabel: new network name
    pifIds:
    - ${data.xenorchestra_pif.eth1.id}
    - ${data.xenorchestra_pif.eth2.id}
    poolId: ${data.xenorchestra_host.host1.pool_id}
